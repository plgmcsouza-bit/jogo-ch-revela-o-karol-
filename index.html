<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qual será o bebê da Carol?</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f3f3f0,#e8e7e2);min-height:100vh;display:flex;align-items:center;justify-content:center;color:#443846}
.card{width:min(92%,430px);background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 18px 60px #55504a22;text-align:center}
.emoji{font-size:48px}.small{font-size:13px;color:#9b8495;text-transform:uppercase;letter-spacing:2px;font-weight:700}
h1{font-size:29px;margin:10px 0 8px}p{line-height:1.5;color:#705f6c}.btn{width:100%;border:0;border-radius:18px;padding:16px;margin-top:12px;font-size:17px;font-weight:700;cursor:pointer;background:#d9d8d2;color:#3f403d}.btn.alt{background:#cfcfca;color:#3f403d}
.hidden{display:none}.question{font-size:21px;font-weight:700;margin:22px 0}.progress{height:7px;background:#eee;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#d993b4;transition:.3s}
#reveal{min-height:320px;display:flex;flex-direction:column;justify-content:center}.reveal{font-size:74px;animation:pop .8s ease}.pink{font-size:34px;font-weight:800;color:#c76591} @keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;top:-20px;width:10px;height:18px;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>
<body>
<div class="card">
<div id="start">
<div class="emoji">👶🏻</div><div class="small">Chá revelação da Carol</div>
<h1>Qual será o sexo do bebê?</h1>
<p>Faça seu palpite e descubra se você acertou! 🤭<br><b>Mas cuidado: a revelação só aparece no final.</b></p>
<button class="btn" id="startBtn">COMEÇAR O JOGO</button>
</div>

<div id="game" class="hidden">
<div class="small" id="count">Pergunta 1 de 5</div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="q"></div>
<div id="answers"></div>
</div>

<div id="reveal" class="hidden">
<div class="small">O momento chegou...</div>
<div id="dramatic" style="font-size:22px;margin:25px 0">Preparando a revelação... 👀</div>
</div>
</div>

<script>
const qs=[
["Qual é o seu palpite?","MENINA","MENINO"],
["Qual nome combina mais com o bebê?","🌸 Um nome delicado","⭐ Um nome forte"],
["Seu coração está dizendo...","💗 Menina","💙 Menino"],
["Hora de arriscar de verdade!","🎀 MENINA","🩵 MENINO"],
["Última chance!","MENINA","MENINO"]
];
let i=0;
function start(){document.getElementById("start").style.display="none";document.getElementById("game").classList.remove("hidden");render()}
function render(){
document.getElementById('count').textContent=`Pergunta ${i+1} de ${qs.length}`;
document.getElementById('bar').style.width=((i+1)/qs.length*100)+"%";
document.getElementById('q').textContent=qs[i][0];
document.getElementById("answers").innerHTML=qs[i].slice(1).map((x,n)=>`<button class="btn ${n?"alt":""} answerBtn">${x}</button>`).join(""); 
}
function answer(){i++; if(i<qs.length)render(); else reveal()}
function reveal(){
document.getElementById('game').classList.add('hidden');document.getElementById('reveal').classList.remove('hidden');
setTimeout(()=>{document.getElementById('dramatic').innerHTML='<div class="reveal">🎀</div><div class="pink">É MENINA! 💗</div><p>A Carol e o Emanuel vão ter uma princesinha! 👶🏻🌸</p>';confetti()},2600)
}
function confetti(){
for(let j=0;j<90;j++){let s=document.createElement('i');s.className='confetti';s.style.left=Math.random()*100+'vw';s.style.background=['#f3a6c5','#d9b4e8','#ffd3e1','#fff'][j%4];s.style.animationDelay=Math.random()*1.2+'s';document.body.appendChild(s)}
}
document.addEventListener("click",function(e){
  if(e.target && e.target.id==="startBtn"){start();return;}
  if(e.target && e.target.classList && e.target.classList.contains("answerBtn")){answer();}
});
</script>
</body>
</html>
